[[redirects]]
  from = "https://anastopoulos-orthopedikos.gr/index.html"
  to = "https://anastopoulos-orthopedikos.gr/"

[[redirects]]
from = "https://preview-anasto.netlify.com/*"
to = "https://anastopoulos-orthopedikos.gr/:splat"
status = 301
force = true

[build]
  command = "npm run generate"
  publish = "dist"

[build.environment]
  NODE_VERSION = "16.20.0"
  NPM_FLAGS = "--legacy-peer-deps"